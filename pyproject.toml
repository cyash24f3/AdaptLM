[project]
name = "adaptlm"
version = "0.1.0"
description = "Grounded support triage, local LoRA, and honest serving benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "pydantic-settings==2.10.1", "jinja2==3.1.6", "numpy==2.2.6",
  "scikit-learn==1.7.1", "psutil==7.0.0", "httpx==0.28.1"
]

[project.optional-dependencies]
model = ["torch==2.14.0", "transformers==4.57.1", "peft==0.17.1", "safetensors==0.6.2", "accelerate==1.10.1"]
train = ["trl==0.24.0", "datasets==4.2.0"]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.11", "mypy==1.17.1", "types-psutil==7.0.0.20250822"]

[project.scripts]
adaptlm = "adaptlm.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptlm"]

# Linux fixture/CPU inference must not download CUDA libraries. CUDA is a separate
# explicitly selected and currently unverified environment (docs/cuda.md).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a real model; opt in only"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
